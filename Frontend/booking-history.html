<!DOCTYPE html>
<html>
<head>
<title>My Bookings</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#020617;
color:white;
padding:40px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card{
background:#0f172a;
padding:20px;
border-radius:12px;
}

.card h2{
margin-bottom:10px;
color:#3b82f6;
}

.card p{
margin:8px 0;
}

button{
margin-top:15px;
width:100%;
padding:12px;
background:red;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>My Bookings</h1>

<div class="container" id="bookingList">

</div>

<script>

const token = localStorage.getItem("token");

if(!token){

alert("Please Login");

window.location.href="login.html";

}

loadBookings();

async function loadBookings(){

try{

const response = await fetch(
"http://localhost:5000/api/bookings/my-bookings",{

headers:{
Authorization:"Bearer "+token
}

});

const data = await response.json();

const bookingList =
document.getElementById("bookingList");

bookingList.innerHTML="";

if(data.length===0){

bookingList.innerHTML=
"<h2>No Booking Found</h2>";

return;

}

data.forEach(booking=>{

bookingList.innerHTML+=`

<div class="card">

<h2>${booking.parkingId.name}</h2>

<p><b>Location :</b> ${booking.parkingId.location}</p>

<p><b>Vehicle :</b> ${booking.vehicleNumber}</p>

<p><b>Booking Time :</b>

${new Date(
booking.bookingTime
).toLocaleString()}

</p>

<button
onclick="cancelBooking('${booking._id}')">

Cancel Booking

</button>

</div>

`;

});

}catch(err){

alert("Server Error");

}

}

async function cancelBooking(id){

const confirmCancel=
confirm("Cancel this booking?");

if(!confirmCancel) return;

const response=await fetch(

"http://localhost:5000/api/bookings/cancel/"+id,

{

method:"DELETE",

headers:{
Authorization:"Bearer "+token
}

}

);

const data=await response.json();

alert(data.message);

loadBookings();

}

</script>

</body>
</html>
