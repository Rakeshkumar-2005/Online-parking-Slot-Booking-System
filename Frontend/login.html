<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{
background:#020617;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.box{
background:#0f172a;
padding:30px;
border-radius:15px;
width:350px;
}

h2{
color:white;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

p{
color:white;
text-align:center;
}
a{
color:#3b82f6;
}
</style>
</head>
<body>

<div class="box">

<h2>Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">
Login
</button>

<p>
Don't have an account?
<a href="register.html">
Register
</a>
</p>
<p>
Return Home Page
<a href="index.html">
Home
</a>
</p>

</div>

<script>

async function login(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(!email || !password){
        alert("Please fill all fields");
        return;
    }
     // Email format validation
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailRegex.test(email)) {
        alert("Please enter a valid email address");
        return;}

    try{

        const response = await fetch("https://online-parking-slot-booking-system.onrender.com/api/users/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email,
                password
            })

        });

        const data = await response.json();

        if(response.ok){

            // JWT Token Save
            localStorage.setItem("token", data.token);
                // Save User Details
    localStorage.setItem("user", JSON.stringify(data.user));

            alert(data.message);

            // Home Page
            window.location.href="index.html";

        }else{

            alert(data.message);

        }

    }catch(err){

        console.log(err);
        alert("Server Error");

    }

}
</script>

</body>
</html>
